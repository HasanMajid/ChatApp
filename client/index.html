<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <title>WebSocket Client</title>
    <style>
        h1 {
            color: green;
        }

        .container {
            margin: auto;
            width: fit-content;
        }
    </style>
</head>

<body>
    <h1 style="width: fit-content; margin: auto;">WebSocket Example</h1>
    <div id="join_room_input" class="container">
        <div id="state"></div>
        <input type="text" id="room_id_input" placeholder="Enter Room ID">
        <button onclick="joinRoom()">Join Room</button>
        <div id="output"></div>
    </div>

    <div class="container" id="room" style="display: none;">
        <label>Room:</label>
        <span id="room_id"></span>
        <div id="room_messages"></div>
        <input type="text" id="message" placeholder="Enter Message">
        <button onclick="sendMessage()">Send Message</button>
    </div>

    <script>
        // Create a WebSocket instance
        // and connect to the server
        const socket = new WebSocket('https://websocket-chatapp-rpql.onrender.com');

        if (socket.readyState === WebSocket.CONNECTING){
            $("#state").text("Connecting...");
        } else if (socket.readyState === WebSocket.CLOSING){
            $("#state").text("Closing...");
        } else if (socket.readyState === WebSocket.CLOSED){
            $("#state").text("Closed");
        }

        // Event listener for when 
        //the WebSocket connection is opened
        socket.onopen = function (event) {
            // Alert the user that they are 
            // connected to the WebSocket server
            $("#state").text("Connected");
        };

        // Event listener for when a message
        //  is received from the server
        socket.onmessage = function (event) {
            const { meta, room, message } = JSON.parse(event.data);
            
            if (meta === "joined_room") {
                $("#join_room_input").hide();
                $("#room").show();
                $("#room_id").text(room);
            } else if (meta == "room_message") {
                $("#room_messages").append(`<p>${message}</p>`);
            }
        };

        // Event listener for when the 
        // WebSocket connection is closed
        socket.onclose = function (event) {
            console.log('Disconnected from WebSocket server');
        };

        // Function to send a message
        //  to the WebSocket server
        function joinRoom() {
            // Get the room id
            const room = $("#room_id_input").val();
            $("#room_id").text(room);
            console.log(room);
            socket.send(JSON.stringify({
                meta: 'join_room',
                room: room
            }));
        }

        function sendMessage() {
            const message = $("#message").val();
            const room = $("#room_id").text();
            socket.send(JSON.stringify({
                meta: 'send_message',
                room: room,
                message: message
            }));
        }
    </script>
</body>

</html>
